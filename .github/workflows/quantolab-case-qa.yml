name: QuantoLab Case QA

on:
  push:
    branches: [main]
    paths:
      - 'work/quantolab/**'
      - 'work/index.html'
      - 'index.html'
      - 'assets/project-media.css'
      - 'assets/quantolab-case.css'
      - 'assets/main.js'
      - 'qa/quantolab-case-qa.mjs'
      - '.github/workflows/quantolab-case-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantolab-case:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Validate QuantoLab case
        run: node qa/quantolab-case-qa.mjs
