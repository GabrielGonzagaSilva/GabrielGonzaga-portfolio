<svg width="1167" height="1167" viewBox="0 0 1167 1167" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="clip"><rect width="1167" height="1167" rx="0"/></clipPath>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="2 2" numOctaves="3" seed="2966" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="1 0 0 0 -0.5 0 1 0 0 -0.5 0 0 1 0 -0.5 0 0 0 .14 0" result="grainMap"/>
      <feBlend in="SourceGraphic" in2="grainMap" mode="soft-light"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)" filter="url(#grain)">
    <image xlink:href="portrait.webp" href="portrait.webp" width="1254" height="1254" preserveAspectRatio="none" transform="translate(-72.476 -19.411) scale(0.99995) rotate(-2.1097)"/>
  </g>
  <rect x="0.5" y="0.5" width="1166" height="1166" stroke="black" stroke-opacity=".45"/>
</svg>
